<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Marketing Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap">
<style>
/* Layout: dark brand sidebar with section nav (collapses to a top bar on phones); light working canvas with KPI tiles, brand cards and one working view; edit drawer from the right. */
:root{
  --bg:#f3f2f6; --surface:#ffffff; --surface-2:#f6f5f9; --line:#e3e1ea; --fg:#18151f; --muted:#6c6878;
  --side:#17131d; --side-2:#231e2b; --side-fg:#f4f1f8; --side-muted:#a49eb0; --plate:transparent;
  --red:#d81e4b; --red-ink:#fff; --gold:#b8902c; --teal:#1a9fa9; --violet:#7a2e95; --blue:#2f6fc0;
  --ok:#22884f; --warn:#a86a0c; --bad:#c62e2e;
  --b-channel:#e3264f; --b-legacy:#1ba7b3; --b-lul:#b8902c; --b-dev:#7a2e95; --b-academy:#3a9e45; --b-ess:#8b7cf6; --b-other:#8a8596;
  --shadow:0 18px 48px rgba(30,20,50,.16); --shadow-sm:0 1px 2px rgba(30,20,50,.05),0 4px 14px rgba(30,20,50,.04);
  --display:"Playfair Display",Georgia,"Times New Roman",serif;
  --body:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121016; --surface:#1b1821; --surface-2:#221f29; --line:#2f2b38; --fg:#f2eff6; --muted:#a39dae;
  --side:#0c0a10; --side-2:#1a1620; --side-fg:#f4f1f8; --side-muted:#9b95a6; --plate:#f7f5fa;
  --red:#f04870; --red-ink:#fff; --gold:#d6b25a; --teal:#4cc3cc; --violet:#b57bd0; --blue:#7aa7e6;
  --ok:#58c184; --warn:#e0a947; --bad:#f06a63;
  --b-channel:#f04870; --b-legacy:#3cc5cf; --b-lul:#d6b25a; --b-dev:#b57bd0; --b-academy:#6cc46f; --b-ess:#a99dff; --b-other:#8f8a9b;
  --shadow:0 18px 48px rgba(0,0,0,.5); --shadow-sm:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#121016; --surface:#1b1821; --surface-2:#221f29; --line:#2f2b38; --fg:#f2eff6; --muted:#a39dae;
  --side:#0c0a10; --side-2:#1a1620; --side-fg:#f4f1f8; --side-muted:#9b95a6; --plate:#f7f5fa;
  --red:#f04870; --red-ink:#fff; --gold:#d6b25a; --teal:#4cc3cc; --violet:#b57bd0; --blue:#7aa7e6;
  --ok:#58c184; --warn:#e0a947; --bad:#f06a63;
  --b-channel:#f04870; --b-legacy:#3cc5cf; --b-lul:#d6b25a; --b-dev:#b57bd0; --b-academy:#6cc46f; --b-ess:#a99dff; --b-other:#8f8a9b;
  --shadow:0 18px 48px rgba(0,0,0,.5); --shadow-sm:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
button,input,select,textarea{font:inherit}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14.5px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--side)}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-fg);position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:22px;padding-block:24px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:18px;overflow-y:auto}
.brandmark{display:flex;flex-direction:column;gap:2px;padding-inline:8px}
.brandmark .eyebrow{font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;color:var(--side-muted);font-weight:700}
.brandmark h1{font-family:var(--display);font-size:1.5rem;line-height:1.1;margin:0;font-weight:800;text-wrap:balance}
.brandmark h1 span{display:block;background:linear-gradient(90deg,#f0475b,#d81e7a 40%,#8a3fd1 80%);-webkit-background-clip:text;background-clip:text;color:transparent}
nav{display:flex;flex-direction:column;gap:2px}
nav button{display:flex;align-items:center;gap:11px;background:none;border:0;color:var(--side-muted);font:600 .86rem var(--body);padding:9px 10px;border-radius:9px;cursor:pointer;text-align:left;white-space:nowrap}
nav button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button:hover{background:var(--side-2);color:var(--side-fg)}
nav button[aria-current="true"]{background:var(--side-2);color:var(--side-fg);box-shadow:inset 3px 0 0 #f0475b}
nav .n{margin-left:auto;min-width:20px;padding:1px 6px;border-radius:10px;background:#e3264f;color:#fff;font-size:.7rem;text-align:center;font-variant-numeric:tabular-nums}
.side .who{margin-top:auto;font-size:.72rem;color:var(--side-muted);padding-inline:10px;letter-spacing:.04em}
.canvas{min-width:0;display:flex;flex-direction:column}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1380px;width:100%;margin:0 auto}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-block:22px 4px}
.topbar .date{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.topbar h2{font-size:1.75rem;margin:2px 0 0}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:6;flex-direction:column;gap:10px;padding-block:12px 8px;padding-right:max(16px,env(safe-area-inset-right,0px));padding-left:max(16px,env(safe-area-inset-left,0px))}
  .brandmark{flex-direction:row;align-items:baseline;gap:8px;padding:0}
  .brandmark h1{font-size:1.15rem} .brandmark h1 span{display:inline}
  nav{flex-direction:row;overflow-x:auto;scrollbar-width:none}
  nav button{padding:7px 10px} nav button[aria-current="true"]{box-shadow:inset 0 -2px 0 #f0475b}
  .side .who{display:none}
}
main{padding-block:14px 70px}
h2{font-family:var(--display);font-size:1.3rem;margin:0 0 4px;font-weight:700}
.sub{color:var(--muted);margin:0 0 18px;max-width:70ch}
.lbl{font-size:.68rem;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:700}
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:24px}
.strip>div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:4px;min-width:0}
.strip b{display:block;font-family:var(--display);font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.strip .hot{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.strip .hot b{color:var(--bad)}
@media (max-width:700px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:600 .82rem var(--body);border-radius:7px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface-2);color:var(--fg)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--red-ink)}
.btn.ghost{background:none}
.btn.small{padding:5px 10px;font-size:.76rem}
.btn.danger{color:var(--bad)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:5px;min-width:0}
label.f>span{font-size:.75rem;font-weight:600;color:var(--muted)}
input[type=text],input[type=date],input[type=url],select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:9px 10px;width:100%}
textarea{min-height:76px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.full{grid-column:1/-1}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;padding:5px 11px;font-size:.8rem;cursor:pointer;background:var(--surface-2)}
.checks input{accent-color:var(--red)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.split{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.hint{font-size:.8rem;color:var(--muted)}
.flag{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:600;border-radius:5px;padding:2px 8px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.flag.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.flag.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.flag.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.b-eman-channel{background:var(--b-channel)} .b-eman-legacy{background:var(--b-legacy)} .b-light-upon-light{background:var(--b-lul)} .b-eman-development{background:var(--b-dev)} .b-eman-academy{background:var(--b-academy)} .b-eman-essentials{background:var(--b-ess)} .b-other{background:var(--b-other)}
.list{display:flex;flex-direction:column;gap:12px}
.req{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.req h3{margin:0;font-size:1.02rem;font-weight:700}
.req .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted);align-items:center}
.req dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;margin:0;font-size:.86rem}
.req dt{color:var(--muted)} .req dd{margin:0;overflow-wrap:anywhere}
.inline{border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.empty{border:1px dashed var(--line);border-radius:12px;padding:28px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-family:var(--display);font-size:1.05rem;margin-bottom:4px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.chip{font:600 .76rem var(--body);border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:6px 11px;border-radius:20px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{color:var(--fg);border-color:var(--fg)}
.filters select{width:auto;padding:6px 10px;font-size:.8rem}
.boardwrap{overflow-x:auto;padding-bottom:8px}
.board{display:grid;grid-template-columns:repeat(6,minmax(210px,1fr));gap:12px;min-width:1300px}
.col{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:180px}
.col header{position:static;background:none;border:0;display:flex;justify-content:space-between;align-items:center;padding:4px 4px 6px}
.card{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:10px;display:flex;flex-direction:column;gap:7px;cursor:pointer;text-align:left;color:var(--fg);font:inherit;width:100%}
.card:hover{border-color:var(--muted)}
.card .t{font-weight:600;font-size:.86rem;line-height:1.35;overflow-wrap:anywhere}
.card .m{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.72rem;color:var(--muted)}
.card .mv{display:flex;justify-content:space-between}
.card .mv button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:5px;padding:1px 8px;cursor:pointer;font-size:.8rem}
.pri-High{color:var(--bad)!important;border-color:color-mix(in srgb,var(--bad) 45%,transparent)!important}
.calhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.calhead h2{margin:0}
.calwrap{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:760px}
.cal .dh{background:var(--surface-2);padding:7px 8px;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.cal .day{background:var(--surface);min-height:108px;padding:6px;display:flex;flex-direction:column;gap:4px;position:relative}
.cal .day.out{background:var(--bg)} .cal .day.out .num{opacity:.4}
.cal .num{font-size:.75rem;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;justify-content:space-between}
.cal .day.today .num span{background:var(--red);color:var(--red-ink);border-radius:4px;padding:0 5px}
.cal .add{background:none;border:0;color:var(--muted);cursor:pointer;font-size:.9rem;line-height:1;padding:0 3px;opacity:.5}
.cal .add:hover{opacity:1}
.ev{font:500 .72rem var(--body);text-align:left;border:0;border-left:3px solid var(--muted);background:var(--surface-2);color:var(--fg);padding:3px 6px;border-radius:4px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%}
.ev.e-eman-channel{border-left-color:var(--b-channel)} .ev.e-eman-legacy{border-left-color:var(--b-legacy)} .ev.e-light-upon-light{border-left-color:var(--b-lul)} .ev.e-eman-development{border-left-color:var(--b-dev)} .ev.e-eman-academy{border-left-color:var(--b-academy)} .ev.e-eman-essentials{border-left-color:var(--b-ess)}
.ev.due{background:none;border:1px dashed var(--line);border-left-width:3px;color:var(--muted)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:.86rem}
th{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-variant-numeric:tabular-nums}
.bar{display:flex;height:7px;border-radius:4px;overflow:hidden;background:var(--surface-2);min-width:120px}
.bar i{display:block}
.drawer{position:fixed;inset:0;z-index:20;display:flex;justify-content:flex-end;background:color-mix(in srgb,#000 45%,transparent)}
.drawer .sheet{background:var(--surface);width:min(560px,100%);height:100%;overflow-y:auto;box-shadow:var(--shadow);padding-block:calc(18px + env(safe-area-inset-top,0px)) calc(28px + env(safe-area-inset-bottom,0px));padding-left:22px;padding-right:max(22px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rules{display:flex;flex-direction:column;gap:6px;background:var(--surface-2);border-radius:9px;padding:12px}
.rules label{display:flex;gap:8px;align-items:flex-start;font-size:.84rem}
.rules input{accent-color:var(--ok);margin-top:4px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:8px;font-weight:600;font-size:.85rem;z-index:30;box-shadow:var(--shadow)}
.notice{border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:8px;padding:10px 14px;background:var(--surface);font-size:.84rem;margin-bottom:16px}
@media (prefers-reduced-motion:no-preference){.drawer .sheet{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}

.planwrap{overflow-x:auto;margin-bottom:26px}
table.plan{min-width:940px;table-layout:fixed;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.plan thead th{text-align:center;padding:9px 6px}
table.plan thead th.today{color:var(--red)}
table.plan thead th small{display:block;font-size:.95rem;letter-spacing:0;color:var(--fg);font-variant-numeric:tabular-nums}
table.plan thead th.today small{color:var(--red)}
table.plan tbody th{width:180px;text-transform:none;letter-spacing:0;font-size:.86rem;color:var(--fg);font-weight:400;vertical-align:top;padding:10px;border-bottom:1px solid var(--line)}
table.plan tbody th .hint{display:block;margin-top:2px}
table.plan td{padding:6px;border-left:1px solid var(--line)}
table.plan td.off{background:repeating-linear-gradient(135deg,transparent 0 7px,var(--surface-2) 7px 8px)}
.pc{width:100%;min-height:64px;text-align:left;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:7px;padding:6px 7px;cursor:pointer;display:flex;flex-direction:column;gap:5px;font:inherit}
.pc:hover{border-color:var(--muted)}
.pc.empty{background:none;border-style:dashed;color:var(--muted);font-size:.76rem;font-weight:600;justify-content:center;align-items:center}
.pc.empty.past{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,transparent)}
.pt{font-size:.77rem;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.pm{display:flex;gap:4px;flex-wrap:wrap}
.pm .flag{font-size:.64rem;padding:1px 6px}
.slotrow{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:12px;border-bottom:1px solid var(--line)}
.slotrow>div:first-child{min-width:0;flex:1}
.icards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-bottom:24px}
.icard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.icard .big{font-family:var(--display);font-size:2rem;font-variant-numeric:tabular-nums;line-height:1.15}
.delta{font-size:.8rem;font-weight:600;color:var(--muted)} .delta.up{color:var(--ok)} .delta.down{color:var(--bad)}
.spark{display:block;width:100%;height:60px;margin-top:8px;overflow:visible}
.spark .ln{fill:none;stroke:var(--gold);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.spark .ar{fill:var(--gold);opacity:.14}
.spark .gd{stroke:var(--line);stroke-width:1}
.spark .end{fill:var(--gold);stroke:var(--surface);stroke-width:2}
.spark .hit{fill:transparent;cursor:default}
.spark .hit:hover{fill:var(--gold);opacity:.35}

.pweek{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin-bottom:26px}
@media (max-width:1100px){.pweek{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:700px){.pweek{grid-template-columns:1fr}}
.pday{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pday.today{border-color:var(--red)}
.pday header{position:static;background:none;border:0;display:flex;align-items:baseline;gap:8px}
.pday header b{font-family:var(--display);font-size:1.2rem;font-variant-numeric:tabular-nums}
.pday.today header b,.pday.today header .lbl{color:var(--red)}
.pday header .hint{margin-left:auto;font-size:.72rem}
.plist{display:flex;flex-direction:column;gap:6px;flex:1}
.plist .pc{min-height:0}
.padd{display:flex;gap:6px}
.padd .btn{flex:1;padding:6px 4px}

.dv{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface-2)}
.fr{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.fth{width:150px;max-width:100%;max-height:190px;object-fit:cover;border-radius:7px;background:var(--bg);border:1px solid var(--line)}
span.fth{display:grid;place-items:center;height:90px;font-weight:700;color:var(--muted)}
.fmeta{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1}
.fmeta b{overflow-wrap:anywhere;font-size:.86rem}
.upl{display:flex;flex-direction:column;gap:6px;border:1px dashed var(--muted);border-radius:8px;padding:12px;cursor:pointer;font-size:.82rem;color:var(--muted)}
.upl input{font:inherit;color:var(--fg);max-width:100%}
.fb{display:flex;flex-direction:column;gap:8px;border-left:3px solid var(--warn);padding-left:10px;font-size:.85rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
a.btn{text-decoration:none;display:inline-block}
.aq{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-bottom:28px}

function logo(id,h=28){const e=ent(id);return LOGOS[id]?`<span class="lg"><img src="${LOGOS[id]}" alt="${esc(e.name)}" style="height:${id==='light-upon-light'?Math.round(h*1.9):h}px"></span>`:`<span class="lg wm" style="font-size:${Math.round(h*.52)}px">${esc(e.name)}</span>`}
const typ=id=>TYPES.find(t=>t.id===id)||TYPES[0];
const stg=id=>STAGES.find(s=>s.id===id)||STAGES[0];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const isoOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>isoOf(new Date());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const daysUntil=s=>s?Math.round((parse(s)-parse(today()))/864e5):null;
const fmt=s=>s?parse(s).toLocaleDateString(undefined,{day:'numeric',month:'short'}):'—';
const store={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};

const S={kit:[],ideas:[],kitBrand:'eman-channel',ideaBrand:'all',repBrand:'eman-channel',repMonth:null,slots:[],insights:[],planBrand:'eman-channel',inBrand:'eman-channel',week:null,view:null,inbox:[],items:[],team:[],brands:{},drafts:{},open:{},brand:'all',owner:'all',month:null,ready:false,offline:false,me:{id:null,canEdit:false,canWrite:null},pending:false,drawer:null};
let db=null,user=null,assetsNS=null,dlNS=null,sampleNS=null,capCtl=null;
S.approvals={};
const LOCKED=['scheduled','published'];
const notApproved=i=>LOCKED.includes(i.stage)&&!S.approvals[i.id];
const awaiting=()=>S.items.filter(i=>i.stage==='review');

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2600)}
function D(k,def=''){return S.drafts[k]??def}
function fieldFocused(){const a=document.activeElement;return a&&document.getElementById('main').contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)}
const ACCESS=[{id:'own',name:'Only their own work'},{id:'poster',name:'Their own work + Posting'},{id:'manager',name:'Everything'}];
const meMember=()=>S.me.id?S.team.find(m=>m.uid===S.me.id):null;
const restricted=()=>S.me.canEdit&&!S.me.isOwner&&meMember()?.access!=='manager';
function render(){ if(fieldFocused()){S.pending=true;return} S.pending=false; const ids=tabsList().map(t=>t[0]); if(S.ready&&!ids.includes(S.view))S.view=ids[0]; renderTabs(); const m=document.getElementById('main'); m.innerHTML=VIEWS[S.view]?VIEWS[S.view]():''; }
document.addEventListener('focusout',()=>setTimeout(()=>{if(S.pending&&!fieldFocused())render()},0));
document.addEventListener('input',e=>{const k=e.target.dataset?.draft;if(k)S.drafts[k]=e.target.type==='checkbox'?e.target.checked:e.target.value});
document.addEventListener('change',e=>{const k=e.target.dataset?.draft;if(k){S.drafts[k]=e.target.type==='checkbox'?e.target.checked:e.target.value; if(e.target.dataset.live){e.target.blur();render()}}});

/* ---------- helpers on data ---------- */
const openItems=()=>S.items.filter(i=>i.stage!=='published');
const memberName=id=>S.team.find(m=>m.id===id)?.name||'';
const initials=n=>n.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');
function dueFlag(due,stage){ if(!due||stage==='published')return ''; const d=daysUntil(due); if(d<0)return `<span class="flag bad">Overdue ${-d}d</span>`; if(d<=2)return `<span class="flag warn">Due ${d===0?'today':d===1?'tomorrow':'in 2d'}</span>`; return `<span class="flag">Due ${fmt(due)}</span>`}
function shortNotice(r){ const d=daysUntil(r.due); return d!==null && d<typ(r.type).lead }
function filtered(list){return list.filter(i=>(S.brand==='all'||i.brand===S.brand)&&(S.owner==='all'||(S.owner==='none'?!i.owner:i.owner===S.owner)))}
function opts(list,sel,valF=x=>x.id,nameF=x=>x.name){return list.map(x=>`<option value="${esc(valF(x))}"${valF(x)===sel?' selected':''}>${esc(nameF(x))}</option>`).join('')}
function platformChecks(prefix,selected){return `<div class="checks">${PLATFORMS.map(p=>`<label><input type="checkbox" data-draft="${prefix}.${p}" ${D(prefix+'.'+p, selected?.includes(p)||false)?'checked':''}> ${p}</label>`).join('')}</div>`}
const pickPlatforms=prefix=>PLATFORMS.filter(p=>S.drafts[prefix+'.'+p]);

/* ---------- tabs ---------- */
function tabsList(){
  if(!S.me.canEdit) return [['submit','New request'],['mine','My requests']];
  if(restricted()){const m=meMember(); if(!m)return [['claim','Get started']];
    const mine=S.items.filter(i=>i.owner===m.id&&['briefed','production'].includes(i.stage)).length;
    return [['mywork','My work',mine],...(m.access==='poster'?[['posting','Posting',toSchedule().length]]:[]),['ideas','Ideas'],['kit','Brand kit']];}
  const n=S.inbox.filter(r=>r.status==='new').length+(S.me.isOwner?awaiting().length:0);
  return [['home','Overview'],['inbox','Inbox',n],['plan','Content plan'],['posting','Posting',toSchedule().length],['board','Pipeline'],['calendar','Calendar'],['ideas','Ideas'],['insights','Insights'],['reports','Reports'],['team','Team'],['kit','Brand kit'],['submit','New request']];

VIEWS.mine=()=>mineList();
function mineList(){
  const mine=S.inbox.filter(r=>S.me.id&&r.createdBy===S.me.id).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  const itemOf=r=>S.items.find(i=>i.id===r.itemId);
  const pending=r=>r.decisionAt&&r.decisionAt>(itemOf(r)?.clientHandledAt||0);
  const label=r=>{ if(r.status==='new')return `<span class="flag">Waiting for review</span>`; if(r.status==='needs_info')return `<span class="flag warn">More info needed</span>`; if(r.status==='declined')return `<span class="flag bad">Declined</span>`;
    const it=itemOf(r); if(!it)return `<span class="flag ok">Accepted</span>`;
    if(pending(r))return r.clientDecision==='approved'?'<span class="flag ok">You approved it</span>':'<span class="flag warn">Changes sent to the team</span>';
    if(it.stage==='approval')return '<span class="flag warn">Ready for you to review</span>';
    if(it.stage==='published')return `<span class="flag ok">${isSocial(it)?'Posted':'Delivered'}</span>`;
    if(it.stage==='scheduled')return '<span class="flag ok">Approved, being scheduled</span>';
    return '<span class="flag">In progress</span>'};
  const deliv=(r,it)=>{ if(!it||!['approval','scheduled','published'].includes(it.stage))return '';
    const files=it.files||[]; const review=it.stage==='approval'&&!pending(r);
    return `<div class="dv"><span class="lbl">${review?'Ready for you to review':'Finished work'}</span>
      ${it.clientMsg?`<p style="margin:0">${esc(it.clientMsg)}</p>`:''}
      ${files.map(f=>`<div class="fr">${(f.type||'').startsWith('video/')?`<video class="fth" src="${blobUrl(f.id)}" controls preload="metadata" playsinline></video>`:thumb(f,'fth')}<div class="fmeta"><b>${esc(f.name)}</b><span class="hint">${(f.size/1048576).toFixed(1)} MB</span>
        <div>${dlNS?`<button class="btn small" data-act="dlfile" data-item="${esc(it.id)}" data-f="${esc(f.id)}">Download</button>`:`<a class="btn small" href="${blobUrl(f.id)}" target="_blank" rel="noopener">Open</a>`}</div></div></div>`).join('')}
      ${it.deliveryLink&&/^https?:\/\//.test(it.deliveryLink)?`<div><a class="btn small" href="${esc(it.deliveryLink)}" target="_blank" rel="noopener">Open files link</a></div>`:''}
      ${review?(S.open['chg.'+r.id]?`<label class="f"><span>What needs changing?</span><textarea id="cc-${r.id}" data-draft="cchg.${r.id}">${esc(D('cchg.'+r.id))}</textarea></label><div class="row"><button class="btn primary small" data-act="cdecide" data-v="changes" data-id="${r.id}">Send changes</button><button class="btn ghost small" data-act="toggle" data-k="chg.${r.id}">Cancel</button></div>`
        :`<div class="row"><button class="btn primary small" data-act="cdecide" data-v="approved" data-id="${r.id}">Approve</button><button class="btn small" data-act="toggle" data-k="chg.${r.id}">Request changes</button></div>`):''}
    </div>`};
  return `<h2>Your requests</h2><p class="sub">Track where each request is. When work is ready, review it here, then approve it or ask for changes. Finished files stay here to download.</p>
  <div class="list">${mine.length?mine.map(r=>`<div class="req"><div class="row" style="justify-content:space-between"><h3>${esc(r.title)}</h3>${label(r)}</div>
    <div class="meta"><span><i class="dot b-${esc(r.entity)}"></i> ${esc(ent(r.entity).name)}</span><span>${esc(typ(r.type).name)}</span>${r.firstDraft?`<span>First draft ${fmt(r.firstDraft)}</span>`:''}<span>Launch ${fmt(r.due)}</span></div>
    ${r.teamNote&&r.status!=='accepted'?`<div class="notice" style="margin:0"><span class="lbl">From the team</span><br>${esc(r.teamNote)}</div>`:''}
    ${r.status==='needs_info'?(S.open['reply.'+r.id]?`<div class="inline"><label class="f"><span>Your reply</span><textarea id="rp-${r.id}" data-draft="reply.${r.id}">${esc(D('reply.'+r.id))}</textarea></label><div class="row"><button class="btn primary small" data-act="reply" data-id="${r.id}">Send reply</button><button class="btn ghost small" data-act="toggle" data-k="reply.${r.id}">Cancel</button></div></div>`:`<div><button class="btn small" data-act="toggle" data-k="reply.${r.id}">Reply</button></div>`):''}
    ${deliv(r,itemOf(r))}
  </div>`).join(''):emptyBox('No requests yet','Requests you send from the form appear here with their progress.')}</div>`;
}

/* brand decisions flow back into the pipeline when someone on the team has the page open */
const reconciling=new Set();
async function reconcile(){
  if(!canManage()||!db)return;
  for(const r of S.inbox){ if(!r.itemId||!r.decisionAt)continue; const it=S.items.find(i=>i.id===r.itemId);
    if(!it||it.stage!=='approval'||(it.clientHandledAt||0)>=r.decisionAt||reconciling.has(it.id))continue;
    reconciling.add(it.id);
    const upd=r.clientDecision==='approved'?{stage:isSocial(it)?'scheduled':'published',clientHandledAt:r.decisionAt,clientApprovedAt:r.decisionAt,updatedAt:Date.now()}
      :{stage:'production',clientHandledAt:r.decisionAt,feedback:[...(it.feedback||[]),{note:r.clientNote||'',at:r.decisionAt,from:'brand'}],updatedAt:Date.now()};
    try{await db.collection('items').doc(it.id).update(upd)}catch{} finally{reconciling.delete(it.id)}
  }
}

VIEWS.calendar=()=>{
  const m=S.month||(S.month=today().slice(0,7)); const [y,mo]=m.split('-').map(Number);
  const first=new Date(y,mo-1,1); const start=new Date(first); start.setDate(1-((first.getDay()+6)%7));
  const list=filtered(S.items); const t=today();
  let cells='';
  for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const iso=isoOf(d);
    const live=list.filter(x=>x.publishDate===iso); const due=list.filter(x=>!x.publishDate&&x.due===iso&&x.stage!=='published');
    cells+=`<div class="day${d.getMonth()!==mo-1?' out':''}${iso===t?' today':''}"><div class="num"><span>${d.getDate()}</span><button class="add" data-act="newitem" data-date="${iso}" aria-label="Add content on ${iso}">+</button></div>
      ${live.map(x=>`<button class="ev e-${esc(x.brand)}" data-act="open" data-id="${x.id}" title="${esc(x.title)}">${x.stage==='published'?'✓ ':''}${esc(x.title)}</button>`).join('')}

const mondayOf=s=>{const d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return isoOf(d)};
const dv=(k,def)=>S.drafts[k]!==undefined?S.drafts[k]:def;
const num=v=>{const t=String(v??'').replace(/[,\s]/g,'');if(t==='')return null;const n=Number(t);return Number.isFinite(n)?n:null};
const nf=n=>n==null?'—':Number(n).toLocaleString();
const slotDoc=(sid,d)=>`${sid}--${d}`;
const dayLabel=d=>!d?.length?'No days set':d.length===7?'Every day':d.slice().sort().map(i=>DAYN[i]).join(', ');
function brandChips(act,cur){return `<div class="bchips">${BRANDS.map(e=>`<button class="bchip" data-act="${act}" data-v="${e.id}" aria-pressed="${cur===e.id}" aria-label="${esc(e.name)}">${logo(e.id,26)}</button>`).join('')}</div>`}
const platsOf=i=>(i.platforms&&i.platforms.length?i.platforms:['Instagram']).filter(p=>p!=='Print');
const allSched=i=>platsOf(i).every(p=>i.sched&&i.sched[p]);
const toSchedule=()=>S.items.filter(i=>i.stage==='scheduled'&&isSocial(i)&&!allSched(i));
function schedFlag(i){if(allSched(i))return '<span class="flag ok">Scheduled</span>';const d=daysUntil(i.publishDate);
  return d!==null&&d<=1?`<span class="flag bad">Not scheduled · ${d<0?'was due '+fmt(i.publishDate):d===0?'goes out today':'goes out tomorrow'}</span>`:'<span class="flag warn">To schedule</span>'}
function stageFlag(st,i){if(i&&notApproved(i))return '<span class="flag bad">Not approved</span>';if(i&&st==='published'&&!isSocial(i))return '<span class="flag ok">Delivered</span>';if(i&&st==='approval')return `<span class="flag warn">With ${esc(ent(i.brand).name)}</span>`;if(i&&st==='scheduled')return schedFlag(i);return st==='published'?'<span class="flag ok">Posted</span>':st==='scheduled'?'<span class="flag ok">Scheduled</span>':st==='approval'||st==='review'?`<span class="flag warn">${esc(stg(st).name)}</span>`:`<span class="flag">${esc(stg(st).name)}</span>`}
function slotForm(k,s={}){const p='sl.'+k;

/* ---------- insights ---------- */
function spark(r){
  const pts=r.filter(x=>x.followers!=null); if(pts.length<2)return '<p class="hint" style="margin:8px 0 0">Log another week to see the trend line.</p>';
  const W=260,H=60,P=5, vals=pts.map(x=>x.followers), lo=Math.min(...vals), hi=Math.max(...vals), span=hi-lo||1;
  const X=i=>P+i*(W-2*P)/(pts.length-1), Y=v=>hi===lo?H/2:H-P-(v-lo)*(H-2*P)/span;
  const line=pts.map((x,i)=>`${X(i).toFixed(1)},${Y(x.followers).toFixed(1)}`).join(' ');
  const last=pts.length-1;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Followers over ${pts.length} weeks, from ${nf(vals[0])} to ${nf(vals[last])}">
   <line class="gd" x1="0" x2="${W}" y1="${H-P}" y2="${H-P}"/>
   <path class="ar" d="M${X(0)},${H-P} L${line.replace(/ /g,' L')} L${X(last)},${H-P} Z"/>
   <polyline class="ln" points="${line}" vector-effect="non-scaling-stroke"/>
   <circle class="end" cx="${X(last)}" cy="${Y(vals[last])}" r="4"/>
   ${pts.map((x,i)=>`<circle class="hit" cx="${X(i)}" cy="${Y(x.followers)}" r="7"><title>Week of ${fmt(x.week)}: ${nf(x.followers)} followers</title></circle>`).join('')}</svg>
   <div class="row" style="justify-content:space-between"><span class="hint">${fmt(pts[0].week)}</span><span class="hint">${pts.length} weeks</span><span class="hint">${fmt(pts[last].week)}</span></div>`;
}
VIEWS.insights=()=>{
  const b=S.inBrand, rows=S.insights.filter(r=>r.brand===b);
  const plats=PLATFORMS.filter(p=>rows.some(r=>r.platform===p));
  const posts=(p,wk)=>S.items.filter(i=>i.brand===b&&i.stage==='published'&&i.publishDate&&i.publishDate>=wk&&i.publishDate<=addDays(wk,6)&&(i.platforms||[]).includes(p)).length;
  const series=p=>rows.filter(x=>x.platform===p).sort((a,c)=>a.week.localeCompare(c.week));
  const prevOf=r=>{const s=series(r.platform);const i=s.indexOf(r);return i>0?s[i-1]:null};
  const cards=plats.map(p=>{const r=series(p),last=r[r.length-1],prev=r[r.length-2];const d=last.followers!=null&&prev?.followers!=null?last.followers-prev.followers:null;
    return `<div class="icard"><div class="row" style="justify-content:space-between"><span class="lbl">${p} followers</span><span class="hint">Week of ${fmt(last.week)}</span></div>
    <b class="big">${nf(last.followers)}</b><span class="delta ${d>0?'up':d<0?'down':''}">${d==null?'First week logged':d===0?'No change on previous week':(d>0?'▲ +':'▼ ')+nf(Math.abs(d))+' on previous week'}</span>${spark(r.slice(-12))}</div>`}).join('');
  const all=rows.slice().sort((a,c)=>c.week.localeCompare(a.week)||a.platform.localeCompare(c.platform));
  const trs=all.map(r=>{const pv=prevOf(r);const d=r.followers!=null&&pv?.followers!=null?r.followers-pv.followers:null;const er=r.engagement!=null&&r.reach?(r.engagement/r.reach*100).toFixed(1)+'%':'—';const id=`${r.brand}--${r.platform}--${r.week}`;
    return `<tr><td>${fmt(r.week)}</td><td>${esc(r.platform)}</td><td>${nf(r.followers)}</td><td><span class="delta ${d>0?'up':d<0?'down':''}">${d==null?'—':(d>0?'+':'')+nf(d)}</span></td><td>${nf(r.reach)}</td><td>${nf(r.views)}</td><td>${nf(r.engagement)}</td><td>${er}</td><td>${posts(r.platform,r.week)}</td><td style="min-width:160px">${esc(r.notes||'')}</td>
    <td>${S.open['rmin.'+id]?`<span class="row" style="gap:4px;flex-wrap:nowrap"><button class="btn small danger" data-act="rmins" data-id="${esc(id)}">Delete</button><button class="btn ghost small" data-act="toggle" data-k="rmin.${esc(id)}">Keep</button></span>`:`<button class="btn ghost small" data-act="toggle" data-k="rmin.${esc(id)}" aria-label="Delete this week">Delete</button>`}</td></tr>`}).join('');
  const P='ins.', lastWeek=addDays(mondayOf(today()),-7);
  return brandChips('inbrand',b)+`<div class="row" style="gap:14px;margin-bottom:6px">${logo(b,44)}<h2 style="margin:0">Insights</h2></div><p class="sub">Log each platform once a week, ideally on Monday for the week just finished. Posts published is counted for you from the Pipeline.</p>
  ${plats.length?`<div class="icards">${cards}</div>`:''}
  <div class="split"><div>${all.length?`<div class="tablewrap"><table><thead><tr><th>Week of</th><th>Platform</th><th>Followers</th><th>Change</th><th>Reach</th><th>Views</th><th>Engagement</th><th>Eng. rate</th><th>Posts</th><th>Notes</th><th></th></tr></thead><tbody>${trs}</tbody></table></div>`
    :emptyBox('No weeks logged for '+esc(ent(b).name)+' yet','Use the form to add last week’s numbers for each platform. Trends appear from the second week.')}</div>
  <form class="panel" id="insform"><h2>Log a week</h2><div class="grid2" style="margin-top:12px">
    <label class="f"><span>Brand</span><select id="i-brand" data-draft="${P}brand">${opts(BRANDS,dv(P+'brand',b))}</select></label>
    <label class="f"><span>Platform</span><select id="i-plat" data-draft="${P}platform">${opts(PLATFORMS.filter(x=>x!=='Print'&&x!=='Website'),dv(P+'platform','Instagram'),x=>x,x=>x)}</select></label>
    <label class="f full"><span>Any day in the week</span><input id="i-week" type="date" data-draft="${P}week" value="${esc(dv(P+'week',lastWeek))}"></label>
    <label class="f"><span>Total followers *</span><input id="i-fol" type="text" inputmode="numeric" data-draft="${P}followers" value="${esc(dv(P+'followers',''))}" placeholder="e.g. 312,400"></label>
    <label class="f"><span>Reach / accounts reached</span><input id="i-reach" type="text" inputmode="numeric" data-draft="${P}reach" value="${esc(dv(P+'reach',''))}"></label>
    <label class="f"><span>Views</span><input id="i-views" type="text" inputmode="numeric" data-draft="${P}views" value="${esc(dv(P+'views',''))}"></label>
    <label class="f"><span>Engagement</span><input id="i-eng" type="text" inputmode="numeric" data-draft="${P}engagement" value="${esc(dv(P+'engagement',''))}" placeholder="Likes + comments + shares + saves"></label>
    <label class="f full"><span>Top post and notes</span><textarea id="i-notes" data-draft="${P}notes" placeholder="What performed best and why">${esc(dv(P+'notes',''))}</textarea></label></div>
    <div class="row" style="margin-top:12px"><button class="btn primary" type="submit">Save week</button></div><p class="hint">Saving the same brand, platform and week again updates that row.</p></form></div>`;

VIEWS.home=()=>{

/* ---------- monthly reports ---------- */
function monthReport(b,m){
  const [y,mo]=m.split('-').map(Number), start=`${m}-01`, end=isoOf(new Date(y,mo,0)), t=today();
  const inM=d=>d&&d>=start&&d<=end;
  const items=S.items.filter(i=>i.brand===b&&inM(i.publishDate));
  const posted=items.filter(i=>i.stage==='published'), missed=items.filter(i=>i.stage!=='published'&&i.publishDate<t);
  const byType={}; posted.forEach(i=>{const k=typ(i.type).name;byType[k]=(byType[k]||0)+1});
  const weeks=[]; for(let w=mondayOf(start);w<=end;w=addDays(w,7)){const we=addDays(w,6);weeks.push({w,n:posted.filter(i=>i.publishDate>=w&&i.publishDate<=we).length,p:items.filter(i=>i.publishDate>=w&&i.publishDate<=we).length})}
  const ins=S.insights.filter(r=>r.brand===b&&inM(r.week)); const plats=[...new Set(ins.map(r=>r.platform))];
  const fol=plats.map(p=>{const r=ins.filter(x=>x.platform===p&&x.followers!=null).sort((a,c)=>a.week.localeCompare(c.week));const prevAll=S.insights.filter(x=>x.brand===b&&x.platform===p&&x.week<start&&x.followers!=null).sort((a,c)=>a.week.localeCompare(c.week));
    const from=prevAll.length?prevAll[prevAll.length-1].followers:r[0]?.followers, to=r[r.length-1]?.followers;
    const sum=k=>{const v=ins.filter(x=>x.platform===p&&x[k]!=null);return v.length?v.reduce((s,x)=>s+x[k],0):null};
    return {p,from,to,ch:from!=null&&to!=null?to-from:null,reach:sum('reach'),views:sum('views'),eng:sum('engagement')}});
  const notes=ins.filter(r=>r.notes).map(r=>({w:r.week,p:r.platform,n:r.notes}));
  const reqs=S.inbox.filter(r=>r.entity===b&&r.createdAt&&inM(isoOf(new Date(r.createdAt))));
  const done=S.items.filter(i=>i.brand===b&&i.requestId).map(i=>({i,r:S.inbox.find(x=>x.id===i.requestId),at:i.clientApprovedAt||i.postedAt})).filter(x=>x.at&&x.r?.createdAt&&inM(isoOf(new Date(x.at))));
  const tat=done.length?Math.round(done.reduce((s,x)=>s+(x.at-x.r.createdAt)/864e5,0)/done.length):null;
  const onTime=items.filter(i=>i.publishDate<t||i.stage==='published'), onTimePct=onTime.length?Math.round(onTime.filter(i=>i.stage==='published').length/onTime.length*100):null;
  return {start,end,items,posted,missed,byType,weeks,fol,notes,reqs,done,tat,onTimePct};
}
VIEWS.reports=()=>{
  const b=S.repBrand, m=S.repMonth||(S.repMonth=today().slice(0,7)), R=monthReport(b,m);
  const mName=parse(m+'-01').toLocaleDateString(undefined,{month:'long',year:'numeric'});
  const max=Math.max(1,...R.weeks.map(w=>w.p));

async function draftCaption(){
  const f=document.getElementById('dform'), box=document.getElementById('d-cap'); if(!f||!box||!sampleNS)return;
  const v=id=>f.querySelector('#'+id)?.value.trim()||'';
  const it=S.items.find(i=>i.id===S.drawer.id)||{};
  const brand=v('d-brand')||it.brand, rules=S.brands[brand]?.rules||[], se=S.slots.find(x=>x.id===v('d-series'));
  const plats=[...f.querySelectorAll('input[name=d-plat]:checked')].map(x=>x.value).join(', ')||'Instagram';
  const prompt=`You write social media captions for ${ent(brand).name}, an Islamic media brand. Write ONE caption for this ${typ(v('d-type')).name.toLowerCase()} for ${plats}.

Title: ${v('d-title')}
What's in it: ${v('d-msg')||'(not given)'}
${(it.brief||[]).map(x=>`${x.q}: ${x.a}`).join('\n')}
${se?.guide?'Series guidance: '+se.guide:''}
${rules.length?'Brand rules you must follow:\n- '+rules.join('\n- '):''}

Requirements:
- Open with a strong first line that makes people stop scrolling.
- Warm, sincere and respectful tone. Plain English that every viewer understands.
- Never invent or paraphrase Quran verses, hadith or scholars' words. If a reference is needed, write [add reference] for the team to fill in.
- Include a clear call to action where it fits.
- End with 5 to 10 relevant hashtags on their own line.
- Reply with the caption only. No title, no explanation, no quotation marks.`;
  capCtl?.abort(); capCtl=new AbortController();
  box.innerHTML=`<div class="dv"><div class="row" style="justify-content:space-between"><span class="lbl">Draft caption</span><button type="button" class="btn ghost small" data-act="capstop">Stop</button></div><p id="cap-out" class="capout">Thinking…</p></div>`;
  const out=document.getElementById('cap-out');
  try{const {text}=await sampleNS(prompt,{signal:capCtl.signal,cache:false,onText:({text})=>{out.textContent=text}});
    box.querySelector('.dv').insertAdjacentHTML('beforeend',`<div class="row"><button type="button" class="btn primary small" data-act="capuse" data-m="replace">Use this caption</button><button type="button" class="btn small" data-act="capuse" data-m="add">Add below my notes</button><button type="button" class="btn ghost small" data-act="capdraft">Try again</button></div><p class="hint" style="margin:0">Check every reference and fact before posting.</p>`);
    box.dataset.text=text; box.querySelector('[data-act=capstop]')?.remove();}
  catch(e){ if(e?.code==='cancelled'){box.innerHTML='';return}
    out.textContent=e?.text||''; box.querySelector('[data-act=capstop]')?.remove();
    box.querySelector('.dv').insertAdjacentHTML('beforeend',`<p class="hint" style="margin:0">${e?.code==='not_granted'||e?.code==='sampling_disabled'?'Caption drafting isn’t allowed for your account.':e?.code==='rate_limited'?'Too many requests just now. Try again in a minute.':'Couldn’t draft a caption. Try again.'}</p>`)}
}

function thumb(f,cls){const src=blobUrl(f.id);
  if((f.type||'').startsWith('image/'))return `<img class="${cls}" src="${src}" alt="${esc(f.name)}" loading="lazy">`;
  if((f.type||'').startsWith('video/'))return `<video class="${cls}" src="${src}#t=0.5" preload="metadata" muted playsinline></video>`;
  return `<span class="${cls} none">${esc((f.name.split('.').pop()||'file').toUpperCase())}</span>`}
function renderDeliv(){
  const box=document.getElementById('d-deliv'); if(!box||!S.drawer)return;
  const it=S.items.find(i=>i.id===S.drawer.id);
  if(!it){box.innerHTML=`<div class="dv"><span class="lbl">Finished work</span><p class="hint" style="margin:4px 0 0">Save this first, then the designer or editor can upload the finished files here.</p></div>`;return}
  const files=it.files||[], fb=it.feedback||[], ap=S.approvals[it.id], st=it.stage, canWork=!LOCKED.includes(st)&&st!=='approval';
  const fileRow=f=>`<div class="fr">${(f.type||'').startsWith('video/')?`<video class="fth" src="${blobUrl(f.id)}" controls preload="metadata" playsinline></video>`:thumb(f,'fth')}
    <div class="fmeta"><b>${esc(f.name)}</b><span class="hint">${(f.size/1048576).toFixed(1)} MB · ${new Date(f.at).toLocaleDateString(undefined,{day:'numeric',month:'short'})}</span>
    <div class="row" style="gap:6px">${dlNS?`<button type="button" class="btn small" data-act="dlfile" data-f="${esc(f.id)}">Download</button>`:`<a class="btn small" href="${blobUrl(f.id)}" target="_blank" rel="noopener">Open</a>`}
    ${assetsNS&&(canWork||S.me.isOwner)?(S.drawer.rmf===f.id?`<button type="button" class="btn small danger" data-act="rmfile" data-f="${esc(f.id)}">Remove for good</button><button type="button" class="btn ghost small" data-act="rmfno">Keep</button>`:`<button type="button" class="btn ghost small danger" data-act="rmfask" data-f="${esc(f.id)}">Remove</button>`):''}</div></div></div>`;
  let action='';
  if(st==='review'){
    action=S.me.isOwner?(S.drawer.changes?`<label class="f"><span>What needs changing?</span><textarea id="d-chg" placeholder="Be specific: timestamps, wording, colours"></textarea></label><div class="row"><button type="button" class="btn primary small" data-act="sendchg">Send back to ${esc(memberName(it.owner)||'the team')}</button><button type="button" class="btn ghost small" data-act="chgno">Cancel</button></div>`
      :`<div class="row"><button type="button" class="btn primary" data-act="approve">Approve${it.requestId?' and send to '+esc(ent(it.brand).name):isSocial(it)?' for posting':''}</button><button type="button" class="btn" data-act="chgask">Request changes</button></div>`)
      :`<p class="notice" style="margin:0">Submitted. Waiting for approval before it can be scheduled.</p>`;
  } else if(canWork){
    action=`<div class="row"><button type="button" class="btn primary small" data-act="submitappr" ${files.length||it.deliveryLink?'':'disabled'}>Submit for approval</button>${files.length||it.deliveryLink?'':'<span class="hint">Upload a file or add a link first</span>'}</div>`;
  } else if(ap){ action=`<div class="row" style="gap:6px"><span class="flag ok">Approved ${new Date(ap.approvedAt).toLocaleDateString(undefined,{day:'numeric',month:'short'})}</span>${st==='scheduled'?schedFlag(it)+platsOf(it).map(p=>`<span class="flag${it.sched?.[p]?' ok':''}">${esc(p)}${it.sched?.[p]?' ✓':''}</span>`).join(''):''}</div>${st==='scheduled'?'<p class="hint" style="margin:0">Mark each platform as scheduled from the Posting tab.</p>':''}`}
  else if(LOCKED.includes(st)) action=`<p class="flag bad" style="margin:0">Moved to ${esc(stg(st).name)} without approval</p>`;
  box.innerHTML=`<div class="dv"><div class="row" style="justify-content:space-between"><span class="lbl">Finished work</span>${stageFlag(st,it)}</div>
   ${fb.length?`<div class="fb">${fb.slice().reverse().map(x=>`<div><span class="lbl">${x.from==='brand'?esc(ent(it.brand).name)+' asked for changes':'Changes requested'} · ${new Date(x.at).toLocaleDateString(undefined,{day:'numeric',month:'short'})}</span><br>${esc(x.note)}</div>`).join('')}</div>`:''}
   ${files.map(fileRow).join('')||'<p class="hint" style="margin:0">No files uploaded yet.</p>'}
   ${assetsNS&&canWork?`<label class="upl"><input type="file" id="d-files" multiple accept="image/png,image/jpeg,image/gif,image/webp,video/mp4,video/webm,video/quicktime,application/pdf"><span>Upload images, videos (MP4 or MOV) or PDFs, up to 50 MB each</span></label><span class="hint" id="d-upmsg"></span>`:(!assetsNS&&canWork?'<p class="hint" style="margin:0">Uploading needs Editor access to this page.</p>':'')}
   ${canWork&&it.requestId?`<label class="f"><span>Message for ${esc(ent(it.brand).name)} (shown with the files)</span><textarea id="d-cmsg" placeholder="e.g. Print-ready PDF with 3mm bleed, plus a version for WhatsApp">${esc(it.clientMsg||'')}</textarea></label>`:''}
   ${canWork?`<label class="f"><span>Or a link for big files (Drive, Dropbox, WeTransfer)</span><div class="row" style="flex-wrap:nowrap"><input type="text" id="d-dlink" value="${esc(it.deliveryLink||'')}" placeholder="https://"><button type="button" class="btn small" data-act="savelink">Save link</button></div></label>`:(it.deliveryLink?`<p style="margin:0" class="hint">Link: ${/^https?:\/\//.test(it.deliveryLink)?`<a href="${esc(it.deliveryLink)}" target="_blank" rel="noopener" style="color:var(--gold)">${esc(it.deliveryLink)}</a>`:esc(it.deliveryLink)}</p>`:'')}
   ${action}</div>`;
  const inp=box.querySelector('#d-files'); if(inp)inp.addEventListener('change',e=>uploadFiles(it.id,[...e.target.files]));
}
async function uploadFiles(id,list){
  const msg=document.getElementById('d-upmsg'); const ok=['image/png','image/jpeg','image/gif','image/webp','video/mp4','video/webm','video/quicktime','application/pdf'];
  for(const [n,f] of list.entries()){
    if(msg)msg.textContent=`Uploading ${n+1} of ${list.length}: ${f.name}`;
    if(!ok.includes(f.type)){toast(f.type==='video/quicktime'?`${f.name} is a .mov. Export it as MP4, or add a link instead.`:`${f.name} isn’t a supported type`);continue}
    try{const r=await assetsNS.upload(f);const it=S.items.find(i=>i.id===id);const files=[...(it?.files||[]),{id:r.id,name:f.name,type:r.contentType,size:r.sizeBytes,at:Date.now()}];
      await db.collection('items').doc(id).update({files,updatedAt:Date.now()});
      if(it)it.files=files;}
    catch(err){toast(err?.code==='too_large'?`${f.name} is over 50 MB. Add a link instead.`:err?.code==='quota_or_state'?'Storage is full. Remove old files first.':`Couldn’t upload ${f.name}. Try again.`)}
  }
  if(msg)msg.textContent=''; renderDeliv();
}
function closeDrawer(){document.getElementById('drawer').innerHTML='';S.drawer=null}
async function saveDrawer(e){
  e.preventDefault(); const f=document.getElementById('dform'); const v=id=>f.querySelector('#'+id)?.value.trim()??'';
  if(!v('d-title')){toast('Add a title first');return}
  if(LOCKED.includes(v('d-stage'))&&!S.me.isOwner&&v('d-stage')!==(S.items.find(i=>i.id===S.drawer.id)?.stage)&&!(v('d-stage')==='published'&&S.approvals[S.drawer.id])){toast('Only the approver can schedule or publish');return}
  const body={title:v('d-title'),brand:v('d-brand'),type:v('d-type'),stage:v('d-stage'),priority:v('d-pri'),owner:v('d-owner'),due:v('d-due'),publishDate:v('d-live'),
    platforms:[...f.querySelectorAll('input[name=d-plat]:checked')].map(x=>x.value),message:v('d-msg'),notes:v('d-notes'),assets:v('d-assets'),checks:S.drawer.checks,slotId:v('d-series')||null,updatedAt:Date.now()};
  try{ if(S.drawer.id) await db.collection('items').doc(S.drawer.id).update(body); else if(S.drawer.newId) await db.collection('items').doc(S.drawer.newId).set({...body,source:'plan',slotId:S.drawer.slotId,createdAt:Date.now()}); else {const ref=await db.collection('items').add({...body,source:S.drawer.ideaId?'idea':'team',createdAt:Date.now()}); if(S.drawer.ideaId)await db.collection('ideas').doc(S.drawer.ideaId).update({status:'used',itemId:ref.id,usedAt:Date.now()});}
    toast(S.drawer.id?'Saved':'Added to pipeline'); closeDrawer(); }catch(err){writeErr(err)}
}
function writeErr(err){ toast(err?.code==='invalid_argument'?'You don’t have permission to change this. Ask Fatimah if you need this changed.':err?.code==='quota_exceeded'?'Storage is full. Delete old published items to make room.':'Couldn’t save. Check your connection and try again.') }

document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]'); if(!b)return; const a=b.dataset.act, id=b.dataset.id;
  if(a==='closebg'&&e.target!==b)return;
  if(a!=='closebg'&&b.tagName!=='BUTTON'&&a!=='open'&&!(a==='tab'&&b.classList.contains('tile')))return;
  if(a==='tab'){S.view=b.dataset.v;store.set('emd.view',S.view);render();window.scrollTo(0,0)}
  else if(a==='toggle'){S.open[b.dataset.k]=!S.open[b.dataset.k];render()}

function newCode(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';const r=crypto.getRandomValues(new Uint8Array(8));return [...r].map((x,i)=>(i===4?'-':'')+a[x%a.length]).join('')}
async function createInvite(d){const code=newCode();await db.collection('invites').doc(code).set({...d,used:false,at:Date.now()});S.lastInvite={name:d.name,username:d.username,code};return code}

function deepMerge(a,b){const o={...(a||{})};for(const [k,v] of Object.entries(b||{})){o[k]=v&&typeof v==='object'&&!Array.isArray(v)&&o[k]&&typeof o[k]==='object'&&!Array.isArray(o[k])?deepMerge(o[k],v):v}return o}
function dbErr(e){return {code:e?.code==='42501'||e?.code==='P0001'||/security|permission|not allowed|approver|can't|can’t/i.test(e?.message||'')?'invalid_argument':'unavailable',message:e?.message||''}}
function makeDb(){
  const loaders={};const refresh=t=>(loaders[t]||new Set()).forEach(f=>f());
  const docRef=(t,id)=>({id,
    async set(data){const {error}=await sb.from(t).upsert({id,data});if(error)throw dbErr(error);refresh(t)},
    async update(patch){const {data:row,error:e1}=await sb.from(t).select('data').eq('id',id).maybeSingle();if(e1)throw dbErr(e1);if(!row)throw {code:'invalid_argument',message:'not found'};
      const {data,error}=await sb.from(t).update({data:deepMerge(row.data,patch)}).eq('id',id).select('id');if(error)throw dbErr(error);if(!data?.length)throw {code:'invalid_argument',message:'not allowed'};refresh(t)},
    async delete(){const {error}=await sb.from(t).delete().eq('id',id);if(error)throw dbErr(error);refresh(t)}});
  return {collection:t=>({
    doc:id=>docRef(t,id||crypto.randomUUID().replace(/-/g,'').slice(0,20)),
    async add(data){const r=docRef(t,crypto.randomUUID().replace(/-/g,'').slice(0,20));await r.set(data);return r},
    onSnapshot(next,err){let timer=null,live=true;
      const load=async()=>{const {data,error}=await sb.from(t).select('id,data');if(!live)return;if(error){err&&err(dbErr(error));return}
        next({docs:data.map(r=>({id:r.id,data:()=>r.data||{}}))})};
      (loaders[t]||(loaders[t]=new Set())).add(load);
      load();
      const ch=sb.channel('t-'+t+'-'+Math.random().toString(36).slice(2)).on('postgres_changes',{event:'*',schema:'public',table:t},()=>{clearTimeout(timer);timer=setTimeout(load,300)}).subscribe();
      const iv=setInterval(load,60000);
      return ()=>{live=false;loaders[t]?.delete(load);clearInterval(iv);sb.removeChannel(ch)}}})};
}
const PIX='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
const urlCache={}, pendingUrls=new Set(); let urlTimer=null;
function blobUrl(id){if(!id)return PIX;const c=urlCache[id];if(c&&c.exp>Date.now())return c.url;pendingUrls.add(id);clearTimeout(urlTimer);urlTimer=setTimeout(loadUrls,40);return c?.url||PIX}
async function loadUrls(){const ids=[...pendingUrls];pendingUrls.clear();if(!ids.length||!sb)return;
  const {data}=await sb.storage.from('files').createSignedUrls(ids,3600);
  ids.forEach(id=>{const r=(data||[]).find(x=>x.path===id);urlCache[id]=r?.signedUrl?{url:r.signedUrl,exp:Date.now()+3300e3}:{url:PIX,exp:Date.now()+60e3}});
  render();if(S.drawer?.id)renderDeliv()}
async function fetchBlob(id){const {data,error}=await sb.storage.from('files').download(id);if(error)throw error;return data}
const storageNS={async upload(file,opts={}){const type=opts.type||file.type||'application/octet-stream';if(file.size>50*1024*1024)throw {code:'too_large'};
    const path=`${crypto.randomUUID()}/${file.name.replace(/[^\w.\-]+/g,'_').slice(-80)}`;
    const {error}=await sb.storage.from('files').upload(path,file,{contentType:type,upsert:false});if(error)throw {code:/size|large/i.test(error.message)?'too_large':'upstream_error',message:error.message};
    return {id:path,url:'',sizeBytes:file.size,contentType:type}},
  async delete(path){await sb.storage.from('files').remove([path]);return {deleted:true}}};
const saveNS={async save({filename,data}){const b=data instanceof Blob?data:new Blob([data]);const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);return {status:'saved'}}};

/* ---------- sign-in ---------- */
function showAuth(msg){document.getElementById('auth').hidden=false;document.getElementById('auth-msg').textContent=msg||''}
function authMode(m){document.querySelectorAll('[data-auth]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.auth===m)));document.getElementById('f-in').hidden=m!=='in';document.getElementById('f-setup').hidden=m!=='setup';document.getElementById('auth-msg').textContent=''}
document.addEventListener('click',e=>{const b=e.target.closest('[data-auth]');if(b)authMode(b.dataset.auth)});
document.getElementById('f-in').addEventListener('submit',async e=>{e.preventDefault();const f=e.target,msg=document.getElementById('auth-msg');
  const u=cleanUser(f.username.value),p=f.password.value;if(!u||!p){msg.textContent='Enter your username and password.';return}
  f.querySelector('button').disabled=true;msg.textContent='Signing in…';
  const {error}=await sb.auth.signInWithPassword({email:`${u}@${LOGIN_DOMAIN}`,password:p});f.querySelector('button').disabled=false;
  if(error){msg.textContent='That username or password isn’t right.';return}startApp()});
document.getElementById('f-setup').addEventListener('submit',async e=>{e.preventDefault();const f=e.target,msg=document.getElementById('auth-msg');
  const u=cleanUser(f.username.value),c=f.code.value.trim().toUpperCase(),p=f.password.value,p2=f.password2.value;
  if(!u||!c){msg.textContent='Enter the username and invite code Fatimah sent you.';return}
  if(p.length<8){msg.textContent='Choose a password of at least 8 characters.';return}
  if(p!==p2){msg.textContent='The two passwords don’t match.';return}
  f.querySelector('button').disabled=true;msg.textContent='Checking your invite…';
  try{const {data:ok}=await sb.rpc('check_invite',{p_code:c,p_username:u});if(!ok){msg.textContent='That username and invite code don’t match, or the code was already used.';return}
    let {data,error}=await sb.auth.signUp({email:`${u}@${LOGIN_DOMAIN}`,password:p});
    if(error){msg.textContent=/registered|exists/i.test(error.message)?'This username already has an account. Sign in instead.':'Couldn’t create your account: '+error.message;return}
    if(!data.session){const r=await sb.auth.signInWithPassword({email:`${u}@${LOGIN_DOMAIN}`,password:p});if(r.error){msg.textContent='Account created, but sign-in failed. Ask Fatimah to check that email confirmation is switched off.';return}}
    const {error:ce}=await sb.rpc('claim_invite',{p_code:c,p_username:u});if(ce){msg.textContent='Couldn’t use that invite: '+ce.message;return}
    startApp()}finally{f.querySelector('button').disabled=false}});

/* ---------- boot ---------- */
function defaultView(){const saved=store.get('emd.view');const ids=tabsList().map(t=>t[0]);return ids.includes(saved)?saved:ids[0]}
function sub(col,key,mapFn){db.collection(col).onSnapshot(s=>{S[key]=mapFn(s.docs);render()},()=>{})}
async function startApp(){
  const {data:{user:u}}=await sb.auth.getUser(); if(!u){showAuth();return}
  const {data:prof}=await sb.from('profiles').select('data').eq('id',u.id).maybeSingle();
  if(!prof){await sb.auth.signOut();showAuth('This login isn’t set up yet. Use "First time here?" with your invite code.');return}
  document.getElementById('auth').hidden=true;
  const p=prof.data||{};
  S.me={id:u.id,username:p.username,name:p.name||p.username,role:p.role,entity:p.entity,canEdit:p.role!=='brand',isOwner:p.role==='owner',canWrite:true};
  if(p.entity&&!store.get('emd.entity'))store.set('emd.entity',p.entity);
  if(p.name&&!store.get('emd.name'))store.set('emd.name',p.name);
  db=makeDb(); assetsNS=S.me.canEdit?storageNS:null; dlNS=saveNS;
  S.view=defaultView(); render(); setTimeout(()=>{S.ready=true;render()},2000);
  db.collection('inbox').onSnapshot(sn=>{S.inbox=sn.docs.map(x=>({id:x.id,...x.data()}));render();reconcile()},()=>{});
  db.collection('items').onSnapshot(sn=>{S.items=sn.docs.map(x=>({id:x.id,...x.data()}));render();reconcile();if(S.drawer?.id)renderDeliv()},()=>{});
  db.collection('approvals').onSnapshot(sn=>{S.approvals={};sn.docs.forEach(x=>S.approvals[x.id]=x.data());render();if(S.drawer?.id)renderDeliv()},()=>{});
  sub('team','team',d=>d.map(x=>({id:x.id,...x.data()})).sort((a,b)=>(a.name||'').localeCompare(b.name||'')));
  sub('slots','slots',d=>d.map(x=>({id:x.id,...x.data()})));
  sub('insights','insights',d=>d.map(x=>({id:x.id,...x.data()})));
  sub('kit','kit',d=>d.map(x=>({id:x.id,...x.data()})));
  sub('ideas','ideas',d=>d.map(x=>({id:x.id,...x.data()})));
  sub('invites','invites',d=>d.map(x=>({id:x.id,...x.data()})));
  sub('profiles','profiles',d=>d.map(x=>({id:x.id,...x.data()})));
  db.collection('brands').onSnapshot(s=>{S.brands={};s.docs.forEach(x=>S.brands[x.id]=x.data());render()},()=>{});
}
(async()=>{
  if(!CFG.supabaseUrl||!CFG.supabaseAnonKey||!window.supabase){document.getElementById('auth').hidden=false;document.getElementById('auth-msg').textContent='The dashboard isn’t connected yet. Add your Supabase project URL and anon key to config.js.';return}
  sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true}});
  const {data:{session}}=await sb.auth.getSession(); if(session)startApp(); else showAuth();
})();
